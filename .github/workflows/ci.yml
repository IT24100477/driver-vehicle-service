name: Account Service CI Pipeline

on:
  push:
    branches: [ "main", "master", "account_service", "develop" ]
  pull_request:
    branches: [ "main", "master", "account_service", "develop" ]

jobs:
  build-and-test:
    name: Build & Test (Java 21 + MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Compile Project
        run: ./mvnw compile

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Package JAR Application
        run: ./mvnw package -DskipTests
