spring.datasource.url=jdbc:h2:mem:ridelink_fare_payment_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

jwt.secret=test-jwt-secret-value-for-ridelink-256-bit-key
internal.api.key=test-internal-key

fare.base-fare=100
fare.per-km-rate=80

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
