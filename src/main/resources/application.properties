spring.application.name=fare-payment-service
server.port=8084

spring.datasource.url=${RIDELINK_FARE_PAYMENT_DB_URL}
spring.datasource.username=${RIDELINK_FARE_PAYMENT_DB_USERNAME}
spring.datasource.password=${RIDELINK_FARE_PAYMENT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
internal.api.key=${INTERNAL_API_KEY}

fare.base-fare=100
fare.per-km-rate=80
