spring.application.name=fare-payment-service

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelinkdb}

ridelink.fare.base-fare=${FARE_BASE_FARE:100.00}
ridelink.fare.rate-per-km=${FARE_RATE_PER_KM:50.00}
ridelink.fare.additional-charges=${FARE_ADDITIONAL_CHARGES:0.00}
ridelink.fare.currency=${FARE_CURRENCY:LKR}

jwt.jwks-uri=${ACCOUNT_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
jwt.issuer=${JWT_ISSUER:ridelink-auth-service}
jwt.audience=${JWT_AUDIENCE:ridelink-services}

ride.management.base-url=${RIDE_MANAGEMENT_BASE_URL:http://localhost:8082}